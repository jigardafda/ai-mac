function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function poly(p,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.fill()}
function line(x1,y1,x2,y2,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(Math.round(x1)+.5,Math.round(y1)+.5);ctx.lineTo(Math.round(x2)+.5,Math.round(y2)+.5);ctx.stroke()}
function clear(c="#000"){rect(0,0,W,H,c)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(n){return Math.random()*n}
function blend(a,b,t){const h=s=>parseInt(s,16),ar=[h(a.slice(1,3)),h(a.slice(3,5)),h(a.slice(5,7))],br=[h(b.slice(1,3)),h(b.slice(3,5)),h(b.slice(5,7))];return "#"+ar.map((v,i)=>Math.round(v+(br[i]-v)*clamp(t,0,1)).toString(16).padStart(2,"0")).join("")}
function textWidth(s,sc=1){return String(s).length*6*sc-sc}
function px(s,x,y,c="#fff",sc=1,align="left"){s=String(s).toUpperCase();if(align==="center")x-=textWidth(s,sc)/2;if(align==="right")x-=textWidth(s,sc);ctx.fillStyle=c;let ox=Math.round(x);for(const ch of s){const g=FONT[ch]||FONT[" "];for(let yy=0;yy<7;yy++)for(let xx=0;xx<5;xx++)if(g[yy][xx]==="1")ctx.fillRect(ox+xx*sc,Math.round(y)+yy*sc,sc,sc);ox+=6*sc}}
function fmtTime(t){let m=Math.floor(t/60),s=Math.floor(t%60),d=Math.floor((t%1)*10);return `${m}:${String(s).padStart(2,"0")}.${d}`}
function money(n){return "$"+Math.floor(n).toLocaleString("en-US")}
function suffix(n){return n===1?"ST":n===2?"ND":n===3?"RD":"TH"}
function defaultSave(){return {money:0,bike:0,owned:[0],level:1,best:{},qual:{},muted:false}}
async function load(){try{const s=await aic.storage.get("road-brawl-save"); if(s)save=Object.assign(defaultSave(),s)}catch(e){save=defaultSave()}screen="menu"}
function scheduleSave(){clearTimeout(savedTimer);savedTimer=setTimeout(async()=>{try{await aic.storage.set("road-brawl-save",save)}catch(e){}},180)}
function code(){let v=(save.money&8191)|((save.bike&15)<<13)|((save.level&7)<<17);const abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let out="";for(let i=0;i<8;i++){out+=abc[v&31];v>>=5}let sum=0;for(let c of out)sum=(sum+abc.indexOf(c)+3)&1023;return out+abc[sum&31]+abc[(sum>>5)&31]}
function applyCode(str){const abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";str=str.toUpperCase().replace(/[^A-Z2-9]/g,"").replace(/[IO]/g,"");if(str.length!==10)return false;let body=str.slice(0,8),sum=0;for(let c of body){let k=abc.indexOf(c);if(k<0)return false;sum=(sum+k+3)&1023}if(str[8]!==abc[sum&31]||str[9]!==abc[(sum>>5)&31])return false;let v=0;for(let i=7;i>=0;i--)v=(v<<5)|abc.indexOf(body[i]);save.money=v&8191;save.bike=(v>>13)&15;save.level=clamp((v>>17)&7,1,5);save.owned=[];for(let i=0;i<=save.bike;i++)save.owned.push(i);scheduleSave();message="PASSWORD ACCEPTED";messageT=2;return true}

function AudioSys(){this.ctx=null;this.master=null;this.engine=null;this.engineGain=null;this.menuTimer=0;this.started=false}
AudioSys.prototype.start=function(){if(this.started||save.muted)return;this.started=true;const C=AudioContext||webkitAudioContext;if(!C)return;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=.16;this.master.connect(this.ctx.destination);this.engine=this.ctx.createOscillator();this.engine.type="sawtooth";this.engine.frequency.value=55;this.engineGain=this.ctx.createGain();this.engineGain.gain.value=0;this.engine.connect(this.engineGain);this.engineGain.connect(this.master);this.engine.start()};
AudioSys.prototype.update=function(dt){if(!this.ctx||save.muted)return;const racing=screen==="race"&&game&&!game.finished;this.engineGain.gain.setTargetAtTime(racing?.08:0,this.ctx.currentTime,.05);if(racing)this.engine.frequency.setTargetAtTime(45+game.speed*1.9,this.ctx.currentTime,.04);if(screen!=="race"){this.menuTimer-=dt;if(this.menuTimer<=0){this.menuTimer=.42;this.tone([82,110,147,196][Math.floor(rnd(4))],.08,"square",.025)}}if(game&&game.cop>0&&racing){this.siren=(this.siren||0)+dt;if(this.siren>.45){this.siren=0;this.tone(game.cop%2?660:440,.18,"sine",.07)}}};
AudioSys.prototype.tone=function(f,d,type,g){if(!this.ctx||save.muted)return;const o=this.ctx.createOscillator(),gn=this.ctx.createGain();o.type=type||"square";o.frequency.value=f;gn.gain.value=g||.08;gn.gain.setValueAtTime(gn.gain.value,this.ctx.currentTime);gn.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+d);o.connect(gn);gn.connect(this.master);o.start();o.stop(this.ctx.currentTime+d+.03)};
AudioSys.prototype.noise=function(d,g){if(!this.ctx||save.muted)return;const len=this.ctx.sampleRate*d,b=this.ctx.createBuffer(1,len,this.ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);const s=this.ctx.createBufferSource();s.buffer=b;const gn=this.ctx.createGain();gn.gain.value=g||.1;s.connect(gn);gn.connect(this.master);s.start()};
audio=new AudioSys();

function curveAt(z){
  let base=Math.sin(z/1500+trackIndex)*.75+Math.sin(z/5200+trackIndex*2)*1.0+Math.sin(z/620)*.18;
  if(z<8000)base+=Math.sin(z/580)*.9*(1-z/9000)+Math.sin(z/1400)*.75;
  return base;
}
function hillAt(z){
  let h=Math.sin(z/1800+trackIndex)*80+Math.sin(z/7000)*140;
  if(z<8000)h+=Math.sin(Math.PI*z/8000)*260;
  return h;
}
function roadBend(rel){const z=(game?game.pos:0)+rel;return (curveAt(z)-curveAt(game?game.pos:0))*rel*.055 + Math.sin(z/2400)*35}
function projectRoad(rel){
  rel=Math.max(4,rel); const pos=game?game.pos:0, scale=CAMDEPTH/rel, cy=hillAt(pos), wy=hillAt(pos+rel);
  const y=HOR+scale*(CAMH+cy-wy), half=scale*ROADW*160, center=160+scale*(roadBend(rel)-(game?game.x:0)*ROADW*80);
  return {x:center,y,half,scale,rel};
}
function project(rel,lane=0,side=0){
  if(rel<8||rel>DRAW+1000)return null;const p=projectRoad(rel);if(p.y<0||p.y>HUDY+40)return null;
  return {x:p.x+lane*p.half*.52+side*(p.half+35*p.scale*120),y:p.y,scale:p.scale*120,roadScale:p.scale,half:p.half};
}

function initRace(ti,career=true){
  trackIndex=ti;single=!career;const tr=tracks[ti],len=36000+save.level*4200+ti*1600,roadside=[];
  for(let d=150;d<len+DRAW;d+=145+rnd(165)){
    let ty=tr.obj[Math.floor(rnd(tr.obj.length))]; roadside.push({dist:d,side:Math.random()<.5?-1:1,type:ty});
    if(Math.random()<.45)roadside.push({dist:d+55+rnd(60),side:-roadside[roadside.length-1].side,type:tr.obj[Math.floor(rnd(tr.obj.length))]})
  }
  const opp=opponents.map((o,i)=>({base:o,pos:120+i*55,lane:(i%3-1)*.75,speed:92+save.level*7+rnd(18),hp:3,down:false,anger:rnd(1)}));
  const traffic=[];for(let i=0;i<12;i++)traffic.push(newTraffic(800+i*420+rnd(500)));
  game={pos:0,x:0,speed:0,stamina:100,damage:bikes[save.bike].armor,time:0,len,roadside,opp,traffic,state:"race",crashT:0,flyX:0,cop:0,copDist:1900,weapon:null,hitCD:0,punchT:0,kickT:0,wheelie:0,lean:0,finished:false,results:null,trash:tr.talk[Math.floor(rnd(tr.talk.length))],trashName:opponents[(ti*3+save.level)%opponents.length].name};
  screen="pre";menuIndex=0;
}
function newTraffic(add){const oncoming=Math.random()<.35;return {dist:(game?game.pos:0)+add,lane:oncoming?(Math.random()<.5?-.55:.55):[-.75,0,.75][Math.floor(rnd(3))],speed:oncoming?-(65+rnd(28)):(42+rnd(45)),kind:Math.random()<.25?"truck":"car",color:["#c83030","#3068c8","#d8a030","#d8d8d8","#40a050"][Math.floor(rnd(5))],oncoming}}
function finishRace(busted=false){
  if(game.finished)return;game.finished=true;const rows=game.opp.map(o=>({name:o.base.name,time:game.time+(game.pos-o.pos)/430+Math.random()*8,color:o.base.color}));rows.push({name:"YOU",time:busted?9999:game.time,color:"#f0d040"});rows.sort((a,b)=>a.time-b.time);
  let rank=rows.findIndex(r=>r.name==="YOU")+1,prize=0;if(!busted){prize=Math.max(0,[2500,1500,900,400,150,0][rank-1]||0)*save.level;save.money+=prize}
  const key=`L${save.level}T${trackIndex}`;if(!busted&&rank<=3){save.qual[key]=Math.min(save.qual[key]||9,rank);const bk=`${trackIndex}`;if(!save.best[bk]||game.time<save.best[bk])save.best[bk]=game.time;let all=true;for(let i=0;i<tracks.length;i++)if((save.qual[`L${save.level}T${i}`]||9)>3)all=false;if(all&&save.level<5){save.level++;message=`LEVEL ${save.level} LICENSE EARNED`;messageT=4;aic.notify?.(message)}}
  game.results={rows,rank,prize,busted};scheduleSave();screen="results";menuIndex=0;
}
function updateRace(dt){
  const g=game,b=bikes[save.bike];if(!g)return;g.time+=dt;if(g.hitCD>0)g.hitCD-=dt;if(g.punchT>0)g.punchT-=dt;if(g.kickT>0)g.kickT-=dt;if(messageT>0)messageT-=dt;
  if(g.state==="crash"){g.crashT+=dt;g.speed=0;if(g.cop>0){g.copDist-=260*dt;if(g.crashT>1.3&&g.copDist<80){message="BUSTED BY COUNTY PATROL";messageT=4;audio.noise(.5,.15);finishRace(true)}}if(g.crashT>3.6){g.state="race";g.crashT=0;g.pos+=220;g.cop=Math.max(g.cop,2.5);g.copDist=760;message="RUN! THE COP IS CLOSE";messageT=2.2}return}
  let acc=0;if(keys.ArrowUp){acc=42*b.acc;g.wheelie=Math.min(1,g.wheelie+dt*3)}else g.wheelie=Math.max(0,g.wheelie-dt*4);if(keys.ArrowDown)acc-=g.speed>8?90:32;g.speed+=acc*dt;if(!keys.ArrowUp)g.speed-=18*dt;g.speed=clamp(g.speed,-25,b.max);
  if(Math.abs(g.x)>1.12&&g.speed>25)g.speed-=45*dt;let steer=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);g.lean+=(steer-g.lean)*dt*7;g.x+=steer*dt*(.75+b.handle*.45)*(.35+g.speed/b.max);g.x+=curveAt(g.pos)*dt*g.speed*.0008;g.x=clamp(g.x,-1.65,1.65);
  if(Math.abs(g.x)>1.33&&g.speed>45){g.damage-=dt*3;if(Math.random()<dt*.7)audio.noise(.06,.035)}if(g.speed<0)g.speed=0;g.pos+=g.speed*5*dt;if(g.pos<0)g.pos=0;
  for(const o of g.opp){if(o.down)continue;const target=94+save.level*9+o.base.id*.7;o.speed+=(target-o.speed)*dt*.25;if(Math.abs(o.pos-g.pos)<700){if(o.base.person.includes("cuts")||o.base.person==="dirty"||o.base.person==="blocks")o.lane+=(g.x-o.lane)*dt*(.35+o.anger);else o.lane+=Math.sin(g.time+o.base.id)*dt*.22}else o.lane+=Math.sin(g.time*.6+o.base.id)*dt*.08;o.lane=clamp(o.lane,-.9,.9);o.pos+=o.speed*5*dt;if(Math.abs(o.pos-g.pos)<60&&Math.abs(o.lane-g.x)<.22&&g.speed>35){crash("RIDER TANGLE");o.down=true}}
  for(const c of g.traffic){c.dist+=c.speed*5*dt;const rel=c.dist-g.pos;if(rel<-180||rel>DRAW+1600)Object.assign(c,newTraffic(DRAW+rnd(1800)));if(rel>-30&&rel<85&&Math.abs(c.lane-g.x)<.28&&g.speed>12)crash(c.oncoming?"HEAD-ON HIT":"REAR-END HIT")}
  if(g.cop>0){g.cop-=dt;g.copDist-=Math.max(0,g.speed-55)*2*dt;if(g.copDist<120&&g.speed<18){message="BUSTED BY COUNTY PATROL";messageT=3;finishRace(true)}}
  if(just.KeyZ)attack("punch");if(just.KeyX)attack("kick");if(g.damage<=0){message="BIKE DESTROYED";messageT=3;finishRace(true)}if(g.pos>=g.len)finishRace(false);
}
function crash(txt){const g=game;if(g.state==="crash")return;g.state="crash";g.crashT=0;g.flyX=g.x;g.damage-=28;g.stamina-=20;g.cop=5;g.copDist=900+rnd(600);message=txt;messageT=2.4;audio.noise(.45,.22)}
function attack(kind){const g=game;if(g.hitCD>0||g.state!=="race")return;g.hitCD=kind==="kick"?.55:.38;g.punchT=kind==="punch"?.22:0;g.kickT=kind==="kick"?.28:0;g.speed-=kind==="kick"?7:4;g.stamina-=kind==="kick"?7:4;audio.tone(kind==="kick"?150:220,.08,"square",.09);let best=null,bd=999;for(const o of g.opp){let d=Math.abs(o.pos-g.pos);if(!o.down&&d<125&&Math.abs(o.lane-g.x)<.45&&d<bd){best=o;bd=d}}punchSide=best?(best.lane<g.x?-1:1):(g.lean<0?-1:1);if(best){best.hp-=g.weapon?2:1;best.speed-=18;message=(g.weapon?g.weapon.toUpperCase():"HIT")+" ON "+best.base.name.toUpperCase();messageT=1.1;if(best.hp<=0){best.down=true;save.money+=80;if(!g.weapon&&Math.random()<.75){g.weapon=Math.random()<.5?"CLUB":"CHAIN";message=`PICKED UP ${g.weapon}`;messageT=1.8}scheduleSave()}}else{message=kind==="kick"?"AIR KICK":"WILD SWING";messageT=.6}}

function sky(tr){
  for(let y=0;y<=HOR+10;y++)rect(0,y,W,1,blend(tr.skyTop,tr.skyHor,y/(HOR+10)));

}
function drawResults(){
  clear("#102040");px(game.results.busted?"BUSTED":"RESULTS",160,14,game.results.busted?"#e03030":"#f0d040",2,"center");const r=game.results;px(`${tracks[trackIndex].name}  RANK ${r.rank}${suffix(r.rank)}  PRIZE ${money(r.prize)}`,160,39,"#fff",1,"center");
  for(let i=0;i<Math.min(10,r.rows.length);i++){const row=r.rows[i],y=56+i*13;if(row.name==="YOU")rect(37,y-1,246,10,"#304890");px((i+1)+".",47,y,"#fff");px(row.name,68,y,row.color);px(row.time>9000?"BUSTED":fmtTime(row.time),255,y,"#fff",1,"right")}
  rect(0,200,320,24,"#081020");px("MONEY "+money(save.money)+"    ENTER CONTINUE",160,208,"#f0d040",1,"center");
}
function drawShop(){
  clear("#102040");px("BIKE SHOP",160,14,"#f0d040",2,"center");px("MONEY "+money(save.money),160,38,"#fff",1,"center");const start=clamp(shopIndex-5,0,bikes.length-10);
  for(let j=0;j<10;j++){const i=start+j,b=bikes[i],y=54+j*14,owned=save.owned.includes(i);if(i===shopIndex)drawCursor(11,y-2);px((owned?(i===save.bike?"RIDE":"OWN"):"BUY")+" "+b.name,38,y,"#fff");px(owned?"":money(b.price),150,y,"#f0d040",1,"right");px("SPD "+b.max,166,y,"#fff");px("ARM "+b.armor,254,y,"#fff")}
  rect(0,204,320,20,"#081020");px(messageT>0?message:"ENTER BUYS OR SELECTS",160,211,messageT>0?"#f0d040":"#fff",1,"center");
}
function drawPassword(){
  clear("#102040");px("PASSWORD",160,25,"#f0d040",2,"center");px("CURRENT ROAD CODE",160,58,"#fff",1,"center");px(code(),160,75,"#f0d040",2,"center");px("TYPE CODE AND PRESS ENTER",160,118,"#fff",1,"center");rect(82,137,156,17,"#e8e8e8");px(passInput||"__________",160,142,passInput?"#102040":"#606070",1,"center");px(messageT>0?message:"BACKSPACE EDITS  ESCAPE RETURNS",160,181,messageT>0?"#f0d040":"#fff",1,"center")
}
function drawControls(){
  clear("#102040");px("CONTROLS",160,22,"#f0d040",2,"center");["ARROW UP: ACCELERATE / WHEELIE","ARROW DOWN: BRAKE / REVERSE","ARROW LEFT/RIGHT: STEER AND LEAN","Z: PUNCH NEAREST RIDER","X: KICK NEAREST RIDER","P: PAUSE","M: MUTE SOUND","ESCAPE: BACK"].forEach((l,i)=>px(l,42,58+i*16,"#fff"));px("PRESS ESCAPE",160,200,"#f0d040",1,"center")
}
function drawLoading(){clear("#000");px("LOADING ROAD RASH",160,105,"#f0d040",1,"center")}
function draw(){if(screen==="loading")drawLoading();else if(screen==="menu")drawMenu();else if(screen==="career")drawCareer();else if(screen==="pre")drawPre();else if(screen==="race")drawRace();else if(screen==="results")drawResults();else if(screen==="shop")drawShop();else if(screen==="password")drawPassword();else if(screen==="controls")drawControls()}

function menuAction(){
  if(screen==="menu"){if(menuIndex===0){screen="career";menuIndex=0}else if(menuIndex===1)initRace(trackIndex,false);else if(menuIndex===2){screen="shop";shopIndex=save.bike}else if(menuIndex===3){screen="password";passInput=""}else if(menuIndex===4)screen="controls"}
  else if(screen==="career")initRace(menuIndex,true);else if(screen==="pre"){screen="race";audio.start()}else if(screen==="results"){screen=single?"menu":"career";menuIndex=trackIndex}else if(screen==="shop")buyOrSelect();else if(screen==="password"){if(passInput){if(!applyCode(passInput)){message="INVALID PASSWORD";messageT=2}passInput=""}}
}
function buyOrSelect(){const b=bikes[shopIndex];if(save.owned.includes(shopIndex)){save.bike=shopIndex;message="SELECTED "+b.name;messageT=2;scheduleSave();return}if(save.money>=b.price){save.money-=b.price;save.owned.push(shopIndex);save.bike=shopIndex;message="BOUGHT "+b.name;messageT=2;scheduleSave();audio.tone(523,.12,"square",.08);audio.tone(784,.16,"square",.06)}else{message="NOT ENOUGH PRIZE MONEY";messageT=2;audio.tone(110,.18,"sawtooth",.07)}}
function back(){if(screen==="race")screen="pre";else if(["career","shop","password","controls"].includes(screen)){screen="menu";menuIndex=0}else if(screen==="pre")screen=single?"menu":"career";else if(screen==="results")screen="menu"}
function onKey(e,down){
  if(e.metaKey||e.ctrlKey)return;const used=["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter","Escape","KeyZ","KeyX","KeyP","KeyM","Backspace"].includes(e.code)||screen==="password";if(used)e.preventDefault();
  if(down&&!keys[e.code])just[e.code]=true;keys[e.code]=down;if(!down)return;audio.start();
  if(e.code==="Enter")menuAction();else if(e.code==="Escape")back();else if(e.code==="KeyP"){if(screen==="race")screen="pre";else if(screen==="pre")screen="race"}else if(e.code==="KeyM"){save.muted=!save.muted;scheduleSave()}
  else if(screen==="menu"||screen==="career"){const max=screen==="menu"?4:tracks.length-1;if(e.code==="ArrowDown")menuIndex=clamp(menuIndex+1,0,max);if(e.code==="ArrowUp")menuIndex=clamp(menuIndex-1,0,max)}
  else if(screen==="shop"){if(e.code==="ArrowDown")shopIndex=clamp(shopIndex+1,0,bikes.length-1);if(e.code==="ArrowUp")shopIndex=clamp(shopIndex-1,0,bikes.length-1)}
  else if(screen==="password"){if(e.code==="Backspace")passInput=passInput.slice(0,-1);else if(e.key&&/^[a-zA-Z0-9]$/.test(e.key)&&passInput.length<10)passInput+=e.key.toUpperCase()}
}
addEventListener("keydown",e=>onKey(e,true),{passive:false});
addEventListener("keyup",e=>onKey(e,false),{passive:false});

function present(){
  vctx.imageSmoothingEnabled=false;vctx.fillStyle="#000";vctx.fillRect(0,0,view.width,view.height);
  const scale=Math.min(view.width/320,view.height/224),sw=320*scale,sh=224*scale,x=(view.width-sw)/2,y=(view.height-sh)/2;
  vctx.drawImage(frame,0,0,320,224,x,y,sw,sh);
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;if(screen==="race")updateRace(dt);if(audio)audio.update(dt);if(messageT>0&&screen!=="race")messageT-=dt;draw();present();just={};requestAnimationFrame(loop)
}
load();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
