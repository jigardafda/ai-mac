<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<style>
:root{
  --sidebar-w:200px;
  --list-w:260px;
  --toolbar-h:52px;
  --text:rgba(0,0,0,.85);
  --secondary:rgba(60,60,67,.6);
  --tertiary:rgba(60,60,67,.3);
  --sep:rgba(0,0,0,.1);
  --accent:#007aff;
  --yellow:#ffd60a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font:13px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--text);
  background:#fff;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
.app{height:100%;display:flex;flex-direction:column;min-width:0}
.toolbar{
  height:var(--toolbar-h);
  flex:0 0 var(--toolbar-h);
  display:grid;
  grid-template-columns:minmax(44px,var(--sidebar-w)) var(--list-w) minmax(0,1fr);
  align-items:center;
  background:#f6f6f6;
  border-bottom:1px solid rgba(0,0,0,.08);
  transition:grid-template-columns 160ms cubic-bezier(.2,.8,.2,1);
}
.app.sidebar-hidden{--sidebar-w:0px}
.toolbar-section{height:100%;display:flex;align-items:center;padding:0 10px;gap:8px;min-width:0}
.toolbar-section.sidebar-tools{justify-content:flex-start}
.toolbar-section.list-tools{justify-content:flex-start;border-left:1px solid transparent}
.toolbar-section.editor-tools{justify-content:flex-start;gap:8px;overflow:hidden}
.spacer{flex:1;min-width:6px}
.icon-btn{
  width:28px;height:28px;border:0;background:transparent;border-radius:6px;color:rgba(0,0,0,.6);
  display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 28px;
  transition:background 120ms ease,transform 120ms ease,color 120ms ease,opacity 120ms ease;
}
.icon-btn:hover{background:rgba(0,0,0,.06)}
.icon-btn:active{transform:scale(.97);background:rgba(0,0,0,.09)}
.icon-btn:disabled{opacity:.35;pointer-events:none}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.search{
  width:180px;height:28px;border-radius:7px;border:1px solid rgba(0,0,0,.12);background:#fff;
  display:flex;align-items:center;padding:0 8px;gap:5px;flex:0 0 auto;
  box-shadow:inset 0 1px 0 rgba(0,0,0,.02);
  transition:box-shadow 120ms ease,border-color 120ms ease;
}
.search:focus-within{border-color:rgba(0,122,255,.45);box-shadow:0 0 0 3px rgba(0,122,255,.25)}
.search svg{width:14px;height:14px;color:rgba(60,60,67,.45);stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.search input{
  border:0;outline:0;background:transparent;min-width:0;width:100%;font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:var(--text);
}
.search input::placeholder{color:rgba(60,60,67,.45)}
.content{
  flex:1;min-height:0;display:grid;
  grid-template-columns:var(--sidebar-w) var(--list-w) minmax(0,1fr);
  transition:grid-template-columns 160ms cubic-bezier(.2,.8,.2,1);
}
.sidebar{
  background:#e9e9eb;
  border-right:1px solid var(--sep);
  min-width:0;display:flex;flex-direction:column;overflow:hidden;
  transition:opacity 140ms ease;
}
.app.sidebar-hidden .sidebar{opacity:0;pointer-events:none}
.sidebar-inner{padding:14px 8px 8px;overflow:auto;min-height:0;flex:1}
.section-title{
  font-size:11px;font-weight:600;color:rgba(60,60,67,.55);
  text-transform:none;margin:4px 8px 5px;
}
.folder-row{
  height:28px;border-radius:6px;display:flex;align-items:center;gap:7px;padding:0 8px;
  color:rgba(0,0,0,.82);position:relative;transition:background 120ms ease,color 120ms ease;
}
.folder-row:hover{background:rgba(0,0,0,.04)}
.folder-row.selected{background:var(--accent);color:#fff}
.folder-row.selected .folder-count{color:rgba(255,255,255,.85)}
.folder-row svg{width:16px;height:16px;flex:0 0 16px}
.folder-row .folder-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.folder-count{font-size:12px;color:rgba(60,60,67,.55);margin-left:auto}
.folder-fill{fill:var(--yellow);stroke:rgba(0,0,0,.12);stroke-width:.7}
.new-folder{
  height:36px;border-top:1px solid rgba(0,0,0,.08);display:flex;align-items:center;gap:8px;
  padding:0 14px;color:rgba(0,0,0,.72);background:rgba(233,233,235,.96);
  transition:background 120ms ease;
}
.new-folder:hover{background:rgba(0,0,0,.04)}
.new-folder svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.notes-pane{
  background:#fff;border-right:1px solid var(--sep);min-width:0;overflow:auto;padding:8px 8px 20px;
}
.group-title{
  font-size:11px;font-weight:700;color:rgba(60,60,67,.62);
  margin:9px 8px 4px;
}
.note-row{
  width:100%;border:0;background:transparent;text-align:left;border-radius:8px;padding:10px 10px;
  color:var(--text);display:block;transition:background 120ms ease,transform 120ms ease;
}
.note-row:hover{background:rgba(0,0,0,.04)}
.note-row:active{transform:scale(.995)}
.note-row.selected{background:#e8e8e8}
.notes-pane.focused .note-row.selected{background:#fff3b0}
.note-title{
  font-weight:700;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px;
}
.note-meta{
  font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--secondary);
}
.note-time{color:rgba(0,0,0,.78);margin-right:5px}
.empty-list{
  color:var(--secondary);text-align:center;margin:32px 18px;font-size:13px;
}
.editor-pane{
  min-width:0;background:#fff;position:relative;display:flex;flex-direction:column;overflow:hidden;
}
.editor-scroll{flex:1;overflow:auto;padding:20px 32px 40px}
.editor-date{
  text-align:center;color:rgba(60,60,67,.52);font-size:12px;margin:2px 0 17px;min-height:16px;
}
.note-editor{
  width:100%;max-width:760px;margin:0 auto;min-height:260px;outline:none;white-space:pre-wrap;
  user-select:text;color:rgba(0,0,0,.86);font-size:13px;line-height:1.45;
  caret-color:#000;
}
.note-editor > div,.note-editor > p{min-height:18px}
.note-editor > div:first-child,.note-editor > p:first-child{
  font-size:24px;font-weight:700;line-height:1.22;letter-spacing:-.01em;margin-bottom:8px;
}
.note-editor .checklist-line{
  display:flex;align-items:flex-start;gap:8px;min-height:22px;margin:2px 0;
}
.check-circle{
  width:16px;height:16px;border-radius:50%;border:1.7px solid var(--yellow);flex:0 0 16px;margin-top:1px;
  display:inline-flex;align-items:center;justify-content:center;transition:background 140ms ease,transform 120ms ease;
}
.check-circle:hover{transform:scale(1.06)}
.check-circle.checked{background:var(--yellow)}
.check-circle.checked:after{
  content:"";width:7px;height:4px;border-left:1.7px solid #fff;border-bottom:1.7px solid #fff;transform:rotate(-45deg);margin-top:-1px;
}
.line-text{min-width:2px;outline:none;white-space:pre-wrap}
.saved-status{
  position:absolute;right:20px;top:14px;color:rgba(60,60,67,.55);font-size:12px;opacity:0;
  transition:opacity 180ms ease,color 120ms ease;
  pointer-events:none;
}
.saved-status.show{opacity:1}
.saved-status.error{color:#ff3b30}
.no-selection{
  margin:auto;color:var(--secondary);font-size:13px;text-align:center;padding:30px;
}
.popover{
  position:absolute;z-index:20;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.25);padding:12px;min-width:220px;
  opacity:0;transform:scale(.96);pointer-events:none;
  transition:opacity 160ms cubic-bezier(.2,.8,.2,1),transform 160ms cubic-bezier(.2,.8,.2,1);
}
.popover.open{opacity:1;transform:scale(1);pointer-events:auto}
.popover:before{
  content:"";position:absolute;width:12px;height:12px;background:#fff;border-left:1px solid rgba(0,0,0,.1);border-top:1px solid rgba(0,0,0,.1);
  transform:rotate(45deg);top:-7px;left:24px;
}
.pop-title{font-weight:700;margin-bottom:8px}
.pop-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.text-field{
  height:26px;border:1px solid rgba(0,0,0,.12);border-radius:6px;padding:0 7px;outline:none;flex:1;
  font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
}
.text-field:focus{box-shadow:0 0 0 3px rgba(0,122,255,.25);border-color:rgba(0,122,255,.45)}
.push-btn{
  height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.12);background:#fff;
  box-shadow:0 .5px 1px rgba(0,0,0,.12);padding:0 10px;font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
  transition:transform 120ms ease,background 120ms ease;
}
.push-btn:active{transform:scale(.97)}
.push-btn.default{border-color:rgba(0,80,220,.45);background:linear-gradient(#3b8cff,#0a60ff);color:#fff}
.hidden-file{display:none}
@media(max-width:760px){
  :root{--list-w:230px}
  .app{--sidebar-w:0px}
  .sidebar{display:none}
  .toolbar{grid-template-columns:44px var(--list-w) minmax(0,1fr)}
  .toolbar-section{padding:0 8px}
  .editor-scroll{padding-left:22px;padding-right:22px}
  .search{width:150px}
}
@media(max-width:600px){
  :root{--list-w:205px}
  .search{width:120px}
  .toolbar-section.editor-tools{gap:4px}
  .icon-btn{width:26px;height:28px;flex-basis:26px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="toolbar">
    <div class="toolbar-section sidebar-tools">
      <button class="icon-btn" id="toggleSidebar" title="Hide Sidebar" aria-label="Toggle Sidebar">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"></rect><path d="M9 5v14"></path></svg>
      </button>
    </div>
    <div class="toolbar-section list-tools">
      <button class="icon-btn" id="newNote" title="New Note" aria-label="New Note">
        <svg viewBox="0 0 24 24"><path d="M5 5.5h8.5"></path><path d="M5 10h7"></path><path d="M5 14.5h5"></path><rect x="4" y="4" width="13" height="16" rx="2"></rect><path d="M14 18.5l5.7-5.7a1.6 1.6 0 0 0-2.3-2.3L11.7 16.2 11 19z"></path></svg>
      </button>
    </div>
    <div class="toolbar-section editor-tools">
      <button class="icon-btn" id="deleteNote" title="Delete" aria-label="Delete">
        <svg viewBox="0 0 24 24"><path d="M5 7h14"></path><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"></path><path d="M8 9v10a1.5 1.5 0 0 0 1.5 1.5h5A1.5 1.5 0 0 0 16 19V9"></path><path d="M10.5 11.5v6"></path><path d="M13.5 11.5v6"></path></svg>
      </button>
      <button class="icon-btn" id="formatBtn" title="Format" aria-label="Format">
        <svg viewBox="0 0 24 24"><path d="M4 18l4.2-12h1.6L14 18"></path><path d="M6 14h6"></path><path d="M15 18l2.4-7h1.2l2.4 7"></path><path d="M16 15.5h4"></path></svg>
      </button>
      <button class="icon-btn" id="checkBtn" title="Checklist" aria-label="Checklist">
        <svg viewBox="0 0 24 24"><circle cx="6.5" cy="7" r="2.3"></circle><path d="M11 7h8"></path><circle cx="6.5" cy="17" r="2.3"></circle><path d="M11 17h8"></path></svg>
      </button>
      <button class="icon-btn" id="tableBtn" title="Table" aria-label="Table">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.8"></rect><path d="M4 10h16"></path><path d="M4 14.5h16"></path><path d="M12 5v14"></path></svg>
      </button>
      <button class="icon-btn" id="mediaBtn" title="Media" aria-label="Media">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="M5.5 17l4.2-4.2 3.1 3.1 2.2-2.2 3.5 3.3"></path></svg>
      </button>
      <button class="icon-btn" id="linkBtn" title="Link" aria-label="Link">
        <svg viewBox="0 0 24 24"><path d="M9.5 14.5l5-5"></path><path d="M10.5 7.3l1.2-1.2a4 4 0 0 1 5.7 5.7l-1.2 1.2"></path><path d="M13.5 16.7l-1.2 1.2a4 4 0 1 1-5.7-5.7l1.2-1.2"></path></svg>
      </button>
      <button class="icon-btn" id="shareBtn" title="Copy Note" aria-label="Copy Note">
        <svg viewBox="0 0 24 24"><path d="M12 15V4"></path><path d="M8.5 7.5L12 4l3.5 3.5"></path><path d="M6 11v7.5A1.5 1.5 0 0 0 7.5 20h9a1.5 1.5 0 0 0 1.5-1.5V11"></path></svg>
      </button>
      <div class="spacer"></div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"></circle><path d="M15 15l5 5"></path></svg>
        <input id="searchInput" type="search" placeholder="Search">
      </div>
    </div>
  </div>
  <div class="content">
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="section-title">On My Mac</div>
        <div id="folderList"></div>
      </div>
      <button class="new-folder" id="newFolder" type="button">
        <svg viewBox="0 0 24 24"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2h7A2 2 0 0 1 20.5 9.5v7A2 2 0 0 1 18.5 18.5h-13A2 2 0 0 1 3.5 16.5z"></path><path d="M12 11v5"></path><path d="M9.5 13.5h5"></path></svg>
        <span>New Folder</span>
      </button>
    </aside>
    <section class="notes-pane" id="notesPane" tabindex="-1"></section>
    <main class="editor-pane">
      <div class="saved-status" id="savedStatus">Saved</div>
      <div class="editor-scroll" id="editorScroll">
        <div class="editor-date" id="editorDate"></div>
        <div id="editor" class="note-editor" contenteditable="true" spellcheck="true" aria-label="Note"></div>
      </div>
      <div class="no-selection" id="noSelection" style="display:none">No Note Selected</div>
    </main>
  </div>
</div>

<div class="popover" id="formatPopover">
  <div class="pop-title">Format</div>
  <div style="color:rgba(60,60,67,.65);font-size:12px">The first line of a note is shown as the title. The remaining lines are body text.</div>
  <div class="pop-row"><button class="push-btn" id="copyPlain">Copy Plain Text</button></div>
</div>

<div class="popover" id="linkPopover">
  <div class="pop-title">Add Link</div>
  <div class="pop-row"><input class="text-field" id="linkText" placeholder="Text"></div>
  <div class="pop-row"><input class="text-field" id="linkURL" placeholder="https://example.com"></div>
  <div class="pop-row" style="justify-content:flex-end"><button class="push-btn default" id="insertLink">Add</button></div>
</div>

<div class="popover" id="folderPopover">
  <div class="pop-title">New Folder</div>
  <div class="pop-row"><input class="text-field" id="folderName" placeholder="Folder Name"></div>
  <div class="pop-row" style="justify-content:flex-end"><button class="push-btn default" id="createFolder">Create</button></div>
</div>

<input class="hidden-file" id="fileInput" type="file" accept="image/*">

<script>
(() => {
  const AIC = window.aic || {
    storage:{async get(){return null},async set(){}},
    async setTitle(){}, async notify(){}
  };
  const $ = s => document.querySelector(s);
  const app = $('#app');
  const folderList = $('#folderList');
  const notesPane = $('#notesPane');
  const editor = $('#editor');
  const editorDate = $('#editorDate');
  const noSelection = $('#noSelection');
  const savedStatus = $('#savedStatus');
  const searchInput = $('#searchInput');

  const STORAGE_KEY = 'notes.document.v1';
  let state = {
    notes: [],
    deleted: [],
    customFolders: [],
    folder: 'all',
    selectedId: null,
    draft: null,
    search: '',
    sidebarHidden: false
  };
  let saveTimer = null;
  let saveStatusTimer = null;
  let loadingEditor = false;

  const folderSvg = '<svg viewBox="0 0 24 24"><path class="folder-fill" d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4.3l2 2h6.7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>';

  function id(){ return 'n_' + Math.random().toString(36).slice(2) + Date.now().toString(36); }
  function validDate(iso){
    const d = new Date(iso);
    return Number.isFinite(d.getTime()) ? d : new Date();
  }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function monthName(d){ return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] || 'Jan'; }
  function formatTime(iso){
    const d = validDate(iso);
    let h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0'), ap = h >= 12 ? 'PM':'AM';
    h = h % 12 || 12;
    return `${h}:${m} ${ap}`;
  }
  function formatFullDate(iso){
    const d = validDate(iso);
    return `${d.getDate()} ${monthName(d)} ${d.getFullYear()} at ${formatTime(d.toISOString())}`;
  }
  function derive(note){
    const text = (note && note.body) || '';
    const lines = text.split(/\r?\n/);
    const first = (lines[0] || '').trim();
    const rest = lines.slice(1).join(' ').replace(/\s+/g,' ').trim();
    return {
      title: first || 'New Note',
      preview: rest || 'No additional text'
    };
  }
  function normalizeNote(n){
    const body = typeof n.body === 'string' ? n.body : '';
    const d = derive({body});
    return {
      id: n.id || id(),
      title: d.title,
      body,
      updatedAt: Number.isFinite(new Date(n.updatedAt).getTime()) ? n.updatedAt : new Date().toISOString()
    };
  }
  function sorted(arr){
    return [...arr].sort((a,b) => validDate(b.updatedAt) - validDate(a.updatedAt));
  }
  function activeNotes(){
    if(state.folder === 'recently') return sorted(state.deleted);
    if(state.folder.startsWith('custom:')) return [];
    return sorted(state.notes);
  }
  function filteredNotes(){
    let arr = activeNotes();
    const q = state.search.trim().toLowerCase();
    if(!q) return arr;
    return arr.filter(n => ((derive(n).title + ' ' + n.body).toLowerCase().includes(q)));
  }
  function getSelected(){
    if(state.selectedId === 'draft') return state.draft;
    return [...state.notes, ...state.deleted].find(n => n.id === state.selectedId) || null;
  }
  function showStatus(text, type='ok'){
    savedStatus.textContent = text;
    savedStatus.classList.toggle('error', type === 'error');
    savedStatus.classList.add('show');
    clearTimeout(saveStatusTimer);
    saveStatusTimer = setTimeout(() => savedStatus.classList.remove('show'), type === 'error' ? 2600 : 1400);
  }
  async function persist(silent=false){
    clearTimeout(saveTimer);
    try{
      state.notes = state.notes.map(normalizeNote);
      state.deleted = state.deleted.map(normalizeNote);
      await AIC.storage.set(STORAGE_KEY, {
        notes: state.notes,
        deleted: state.deleted,
        customFolders: state.customFolders
      });
      if(!silent) showStatus('Saved');
    }catch(e){
      showStatus('Save failed','error');
    }
  }
  function schedulePersist(){
    clearTimeout(saveTimer);
    showStatus('Saving…');
    saveTimer = setTimeout(() => persist(false), 450);
  }

  function renderFolders(){
    const folders = [
      ['all','All Notes',state.notes.length],
      ['notes','Notes',state.notes.length],
      ['recently','Recently Deleted',state.deleted.length]
    ];
    folderList.innerHTML = '';
    folders.concat(state.customFolders.map(f => ['custom:'+f.id, f.name, 0])).forEach(([key,name,count]) => {
      const row = document.createElement('div');
      row.className = 'folder-row' + (state.folder === key ? ' selected':'');
      row.innerHTML = folderSvg + `<span class="folder-name"></span><span class="folder-count">${count}</span>`;
      row.querySelector('.folder-name').textContent = name;
      row.addEventListener('click', () => {
        abandonEmptyDraft();
        state.folder = key;
        const first = filteredNotes()[0];
        state.selectedId = first ? first.id : null;
        renderAll();
      });
      folderList.appendChild(row);
    });
  }
  function renderList(){
    const arr = filteredNotes();
    notesPane.innerHTML = '';
    if(!arr.length){
      const div = document.createElement('div');
      div.className = 'empty-list';
      div.textContent = state.search ? 'No matching notes' : (state.folder.startsWith('custom:') ? 'No notes in this folder' : 'No notes');
      notesPane.appendChild(div);
      return;
    }
    const today = [], previous = [];
    const now = new Date();
    arr.forEach(n => sameDay(validDate(n.updatedAt), now) ? today.push(n) : previous.push(n));
    const addGroup = (title, list) => {
      if(!list.length) return;
      const h = document.createElement('div');
      h.className = 'group-title';
      h.textContent = title;
      notesPane.appendChild(h);
      list.forEach(n => {
        const d = derive(n);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'note-row' + (n.id === state.selectedId ? ' selected':'');
        btn.innerHTML = `<div class="note-title"></div><div class="note-meta"><span class="note-time">${formatTime(n.updatedAt)}</span><span class="note-preview"></span></div>`;
        btn.querySelector('.note-title').textContent = d.title;
        btn.querySelector('.note-preview').textContent = d.preview;
        btn.addEventListener('click', () => {
          abandonEmptyDraft();
          state.selectedId = n.id;
          renderList();
          renderEditor();
        });
        notesPane.appendChild(btn);
      });
    };
    addGroup('Today', today);
    addGroup('Previous 7 Days', previous);
  }
  function lineDiv(text, isFirst){
    const div = document.createElement('div');
    if(!isFirst && /^\[( |x|X)\]\s?/.test(text)){
      div.className = 'checklist-line';
      const checked = /^\[(x|X)\]/.test(text);
      const circle = document.createElement('span');
      circle.className = 'check-circle' + (checked ? ' checked':'');
      circle.contentEditable = 'false';
      circle.addEventListener('click', e => {
        e.stopPropagation();
        circle.classList.toggle('checked');
        handleEditorInput();
      });
      const span = document.createElement('span');
      span.className = 'line-text';
      span.textContent = text.replace(/^\[( |x|X)\]\s?/, '');
      if(!span.textContent) span.appendChild(document.createElement('br'));
      div.append(circle, span);
    } else {
      div.textContent = text;
      if(text === '') div.appendChild(document.createElement('br'));
    }
    return div;
  }
  function renderEditor(){
    const note = getSelected();
    if(!note){
      editor.style.display = 'none';
      editorDate.style.display = 'none';
      noSelection.style.display = 'block';
      $('#deleteNote').disabled = true;
      return;
    }
    $('#deleteNote').disabled = state.selectedId === 'draft' && !(note.body || '').trim();
    noSelection.style.display = 'none';
    editor.style.display = '';
    editorDate.style.display = '';
    editorDate.textContent = formatFullDate(note.updatedAt || new Date().toISOString());
    loadingEditor = true;
    editor.innerHTML = '';
    const lines = (note.body || '').split(/\r?\n/);
    if(!lines.length) lines.push('');
    lines.forEach((line,i) => editor.appendChild(lineDiv(line, i===0)));
    loadingEditor = false;
    setTimeout(() => {
      if(document.activeElement !== searchInput) editor.focus({preventScroll:true});
    }, 0);
  }
  function renderAll(){
    app.classList.toggle('sidebar-hidden', state.sidebarHidden);
    renderFolders();
    renderList();
    renderEditor();
  }

  function extractText(){
    const lines = [];
    const pushSplit = text => {
      const parts = String(text).replace(/\u200B/g,'').split(/\r?\n/);
      parts.forEach(p => lines.push(p));
    };
    Array.from(editor.childNodes).forEach(node => {
      if(node.nodeType === Node.TEXT_NODE){
        pushSplit(node.textContent || '');
      }else if(node.nodeType === Node.ELEMENT_NODE){
        const el = node;
        if(el.classList.contains('checklist-line')){
          const checked = el.querySelector('.check-circle')?.classList.contains('checked');
          const txt = el.querySelector('.line-text')?.textContent || '';
          lines.push((checked ? '[x] ' : '[ ] ') + txt.replace(/\u200B/g,''));
        }else{
          pushSplit(el.textContent || '');
        }
      }
    });
    if(!lines.length) return '';
    return lines.join('\n').replace(/\n+$/,'');
  }
  function handleEditorInput(){
    if(loadingEditor) return;
    const text = extractText();
    const now = new Date().toISOString();
    if(state.selectedId === 'draft'){
      if(!text.trim()){
        state.draft.body = '';
        state.draft.updatedAt = now;
        editorDate.textContent = formatFullDate(now);
        return;
      }
      const d = derive({body:text});
      const note = {id:id(), title:d.title, body:text, updatedAt:now};
      state.notes.unshift(note);
      state.draft = null;
      state.selectedId = note.id;
      renderFolders();
      renderList();
      schedulePersist();
      return;
    }
    const note = getSelected();
    if(!note) return;
    note.body = text;
    note.updatedAt = now;
    note.title = derive(note).title;
    editorDate.textContent = formatFullDate(now);
    renderFolders();
    renderList();
    schedulePersist();
  }
  function abandonEmptyDraft(){
    if(state.selectedId === 'draft' && state.draft && !(state.draft.body || '').trim()){
      state.draft = null;
      state.selectedId = null;
    }
  }
  function newNote(){
    abandonEmptyDraft();
    state.folder = state.folder === 'recently' || state.folder.startsWith('custom:') ? 'all' : state.folder;
    state.draft = {id:'draft', title:'New Note', body:'', updatedAt:new Date().toISOString()};
    state.selectedId = 'draft';
    renderAll();
  }
  function deleteSelected(){
    const note = getSelected();
    if(!note) return;
    if(state.selectedId === 'draft'){
      state.draft = null;
      const first = filteredNotes()[0];
      state.selectedId = first ? first.id : null;
      renderAll();
      return;
    }
    if(state.folder === 'recently'){
      state.deleted = state.deleted.filter(n => n.id !== note.id);
    }else{
      state.notes = state.notes.filter(n => n.id !== note.id);
      state.deleted.unshift({...note, updatedAt:new Date().toISOString()});
    }
    const first = filteredNotes()[0];
    state.selectedId = first ? first.id : null;
    renderAll();
    schedulePersist();
  }
  function insertAtEditor(text){
    const note = getSelected();
    if(!note) return;
    editor.focus();
    document.execCommand('insertText', false, text);
    handleEditorInput();
  }
  function appendChecklist(){
    const cur = extractText();
    const next = cur ? cur + '\n[ ] ' : '[ ] ';
    if(state.selectedId === 'draft'){
      state.draft.body = next;
    }else{
      const n = getSelected(); if(!n) return; n.body = next; n.updatedAt = new Date().toISOString();
    }
    renderEditor();
    const last = editor.lastElementChild?.querySelector('.line-text') || editor.lastElementChild;
    if(last){
      const r = document.createRange(); r.selectNodeContents(last); r.collapse(false);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
    handleEditorInput();
  }
  async function copyText(text){
    try{
      if(navigator.clipboard) await navigator.clipboard.writeText(text);
      else throw new Error('fallback');
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
  }
  function positionPopover(pop, anchor){
    document.querySelectorAll('.popover').forEach(p => { if(p !== pop) p.classList.remove('open'); });
    const r = anchor.getBoundingClientRect();
    pop.style.top = (r.bottom + 8) + 'px';
    pop.style.left = Math.max(10, Math.min(window.innerWidth - pop.offsetWidth - 10, r.left - 8)) + 'px';
    pop.classList.toggle('open');
  }

  $('#toggleSidebar').addEventListener('click', () => {
    state.sidebarHidden = !state.sidebarHidden;
    app.classList.toggle('sidebar-hidden', state.sidebarHidden);
  });
  $('#newNote').addEventListener('click', newNote);
  $('#deleteNote').addEventListener('click', deleteSelected);
  editor.addEventListener('input', handleEditorInput);
  editor.addEventListener('paste', e => {
    e.preventDefault();
    const text = e.clipboardData?.getData('text/plain') || '';
    document.execCommand('insertText', false, text);
  });
  notesPane.addEventListener('focusin', () => notesPane.classList.add('focused'));
  notesPane.addEventListener('focusout', () => setTimeout(() => {
    if(!notesPane.contains(document.activeElement)) notesPane.classList.remove('focused');
  },0));
  searchInput.addEventListener('input', () => {
    abandonEmptyDraft();
    state.search = searchInput.value;
    const first = filteredNotes()[0];
    state.selectedId = first ? first.id : null;
    renderList();
    renderEditor();
  });
  $('#checkBtn').addEventListener('click', appendChecklist);
  $('#tableBtn').addEventListener('click', () => insertAtEditor('\nColumn 1\tColumn 2\nItem\tItem'));
  $('#mediaBtn').addEventListener('click', () => $('#fileInput').click());
  $('#fileInput').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if(file) insertAtEditor(`\n[Photo: ${file.name}]`);
    e.target.value = '';
  });
  $('#shareBtn').addEventListener('click', async () => {
    const n = getSelected(); if(!n) return;
    await copyText(extractText() || n.body || '');
    if(AIC.notify) AIC.notify('Note copied');
    showStatus('Copied');
  });
  $('#formatBtn').addEventListener('click', e => positionPopover($('#formatPopover'), e.currentTarget));
  $('#copyPlain').addEventListener('click', async () => {
    await copyText(extractText());
    $('#formatPopover').classList.remove('open');
    showStatus('Copied');
  });
  $('#linkBtn').addEventListener('click', e => {
    positionPopover($('#linkPopover'), e.currentTarget);
    setTimeout(() => $('#linkText').focus(), 30);
  });
  $('#insertLink').addEventListener('click', () => {
    const text = $('#linkText').value.trim();
    const url = $('#linkURL').value.trim();
    if(url) insertAtEditor(text ? `${text} (${url})` : url);
    $('#linkText').value = ''; $('#linkURL').value = '';
    $('#linkPopover').classList.remove('open');
  });
  $('#newFolder').addEventListener('click', e => {
    positionPopover($('#folderPopover'), e.currentTarget);
    setTimeout(() => $('#folderName').focus(), 30);
  });
  $('#createFolder').addEventListener('click', () => {
    const name = $('#folderName').value.trim();
    if(!name) return;
    const f = {id:id(), name};
    state.customFolders.push(f);
    state.folder = 'custom:' + f.id;
    state.selectedId = null;
    $('#folderName').value = '';
    $('#folderPopover').classList.remove('open');
    renderAll();
    schedulePersist();
  });
  document.addEventListener('mousedown', e => {
    if(!e.target.closest('.popover') && !e.target.closest('#formatBtn') && !e.target.closest('#linkBtn') && !e.target.closest('#newFolder')){
      document.querySelectorAll('.popover').forEach(p => p.classList.remove('open'));
    }
  });
  document.addEventListener('keydown', e => {
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f'){
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
    }
    if(e.key === 'Escape'){
      document.querySelectorAll('.popover').forEach(p => p.classList.remove('open'));
      if(document.activeElement === searchInput){ searchInput.blur(); }
    }
  });

  async function init(){
    try{ await AIC.setTitle('Notes'); }catch(e){}
    let saved = null;
    try{ saved = await AIC.storage.get(STORAGE_KEY); }catch(e){}
    if(saved && Array.isArray(saved.notes)){
      state.notes = saved.notes.map(normalizeNote);
      state.deleted = Array.isArray(saved.deleted) ? saved.deleted.map(normalizeNote) : [];
      state.customFolders = Array.isArray(saved.customFolders) ? saved.customFolders.filter(f => f && f.name).map(f => ({id:f.id || id(), name:String(f.name)})) : [];
    }else{
      const body = 'Welcome to Notes\nNotes are saved on this desktop.';
      const d = derive({body});
      state.notes = [{id:id(), title:d.title, body, updatedAt:new Date().toISOString()}];
      state.deleted = [];
      await persist(true);
    }
    state.selectedId = sorted(state.notes)[0]?.id || null;
    if(window.innerWidth <= 760) state.sidebarHidden = true;
    renderAll();
  }
  init();
})();
</script>
</body>
</html>
