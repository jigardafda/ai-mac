<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reminders</title>
<style>
:root{
  --accent:#007aff;--red:#ff3b30;--orange:#ff9500;--yellow:#ffcc00;--green:#34c759;--blue:#007aff;--purple:#af52de;--pink:#ff2d55;--grey:#8e8e93;
  --text:rgba(0,0,0,.85);--secondary:rgba(60,60,67,.6);--tertiary:rgba(60,60,67,.3);--sep:rgba(0,0,0,.1);
  --toolbar:#f6f6f6;--sidebar:#e9e9eb;--content:#fff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font:13px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--text);background:var(--content);user-select:none;
}
button,input,textarea,select{font:inherit}
button{border:0;background:none;color:inherit;padding:0}
.app{height:100%;display:flex;flex-direction:column;min-width:0}
.toolbar{
  height:52px;flex:0 0 52px;background:var(--toolbar);border-bottom:1px solid rgba(0,0,0,.08);
  display:grid;grid-template-columns:250px 1fr;align-items:center;
}
.toolbar-left{display:flex;align-items:center;gap:8px;padding:0 12px}
.toolbar-right{display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:0 14px}
.icon-btn{
  width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:rgba(0,0,0,.68);
  transition:background .12s,transform .12s,color .12s;
}
.icon-btn:hover{background:rgba(0,0,0,.06);color:rgba(0,0,0,.86)}
.icon-btn:active{transform:scale(.97);background:rgba(0,0,0,.09)}
svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;fill:none}
.search{position:relative;width:200px}
.search svg{position:absolute;left:7px;top:6px;width:13px;height:13px;color:var(--secondary)}
.search input{
  width:100%;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.12);background:#fff;
  padding:2px 8px 2px 25px;outline:none;color:var(--text);
  box-shadow:inset 0 1px 0 rgba(0,0,0,.02);
}
.search input:focus{box-shadow:0 0 0 3px rgba(0,122,255,.35)}
.status{font-size:11px;color:var(--secondary);min-width:44px;text-align:right;opacity:0;transition:opacity .18s}
.status.show{opacity:1}
.shell{min-height:0;flex:1;display:flex;position:relative}
.sidebar{
  width:250px;flex:0 0 250px;background:var(--sidebar);border-right:1px solid var(--sep);
  display:flex;flex-direction:column;padding:14px 10px 10px;overflow:hidden;
}
.smart-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tile{
  height:56px;background:rgba(255,255,255,.82);border-radius:10px;position:relative;padding:7px 8px;
  box-shadow:0 .5px 0 rgba(255,255,255,.8),0 .5px 1px rgba(0,0,0,.05);
  text-align:left;transition:background .12s,transform .12s,box-shadow .12s;
}
.tile:hover{background:#fff}
.tile:active{transform:scale(.985)}
.tile.selected{box-shadow:0 0 0 2px rgba(0,122,255,.28),0 .5px 1px rgba(0,0,0,.05);background:#fff}
.tile .circle,.list-dot{
  display:grid;place-items:center;border-radius:50%;color:#fff;flex:0 0 auto;
}
.tile .circle{width:26px;height:26px;position:absolute;left:8px;top:7px}
.tile .circle svg{width:15px;height:15px;stroke-width:1.8}
.tile .count{position:absolute;right:8px;top:3px;font-size:24px;font-weight:700;letter-spacing:-.02em;color:rgba(0,0,0,.82)}
.tile .label{position:absolute;left:9px;bottom:6px;font-weight:700;font-size:13px;color:rgba(0,0,0,.68)}
.completed-tile{
  height:40px;margin-bottom:15px;border-radius:10px;background:rgba(255,255,255,.74);display:flex;align-items:center;
  padding:7px 8px;gap:8px;text-align:left;transition:background .12s,transform .12s,box-shadow .12s;
}
.completed-tile:hover{background:#fff}
.completed-tile.selected{box-shadow:0 0 0 2px rgba(0,122,255,.28);background:#fff}
.completed-tile .circle{width:24px;height:24px;background:var(--grey);display:grid;place-items:center;border-radius:50%;color:#fff}
.completed-tile .label{font-weight:700;flex:1;color:rgba(0,0,0,.7)}
.completed-tile .count{font-weight:700;font-size:18px;color:rgba(0,0,0,.74)}
.toggle-mini{
  margin-left:4px;height:20px;border-radius:10px;background:rgba(0,0,0,.07);padding:0 8px;font-size:11px;font-weight:600;color:rgba(0,0,0,.65);
}
.section-title{
  font-size:11px;font-weight:700;text-transform:none;color:var(--secondary);padding:0 8px 5px;
}
.lists{overflow:auto;min-height:0;flex:1;padding-bottom:8px}
.side-row{
  height:30px;border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 8px;margin:1px 0;
  transition:background .12s,color .12s;
}
.side-row:hover{background:rgba(0,0,0,.04)}
.side-row.selected{background:var(--accent);color:#fff}
.side-row.selected .side-count{color:#fff}
.list-dot{width:22px;height:22px}
.list-dot svg{width:13px;height:13px;stroke-width:1.8}
.side-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.side-count{color:var(--secondary);font-size:12px}
.add-list{
  height:30px;border-radius:7px;display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:500;
  padding:0 8px;transition:background .12s,transform .12s;
}
.add-list:hover{background:rgba(0,0,0,.04)}
.add-list:active{transform:scale(.99)}
.add-list input{
  height:23px;border:1px solid rgba(0,0,0,.12);border-radius:6px;background:#fff;outline:none;padding:0 7px;width:160px;
}
.add-list input:focus{box-shadow:0 0 0 3px rgba(0,122,255,.35)}
.content{
  flex:1;min-width:0;background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;
}
.header{
  min-height:92px;padding:28px 34px 8px;display:flex;align-items:flex-end;gap:12px;
}
.title{
  font-size:34px;line-height:1;font-weight:700;letter-spacing:-.025em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.open-count{margin-left:auto;font-size:34px;line-height:1;font-weight:700;letter-spacing:-.025em;color:rgba(60,60,67,.32)}
.header-toggle{
  height:22px;border-radius:11px;padding:0 10px;background:rgba(0,0,0,.06);color:rgba(0,0,0,.62);font-size:11px;font-weight:700;margin-bottom:3px;
}
.list-area{
  flex:1;min-height:0;overflow:auto;padding:0 26px 28px 30px;position:relative;
}
.empty-state{
  position:absolute;inset:0;display:grid;place-items:center;color:rgba(60,60,67,.34);font-size:18px;font-weight:600;pointer-events:none;
}
.rem-row{
  min-height:36px;border-radius:7px;display:grid;grid-template-columns:28px 1fr 24px 20px;align-items:start;
  padding:4px 6px 3px 4px;transition:background .12s,opacity .18s,transform .18s,height .18s,margin .18s;
  animation:rowIn .18s cubic-bezier(.2,.8,.2,1);
}
@keyframes rowIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.rem-row:hover{background:rgba(0,0,0,.035)}
.rem-row.dragging{opacity:.45}
.rem-row.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.check{
  width:20px;height:20px;border-radius:50%;border:1.8px solid currentColor;margin:4px 4px 0 2px;
  color:var(--list-color);display:grid;place-items:center;transition:background .16s,border-color .16s,transform .16s;
}
.check:hover{transform:scale(1.06)}
.check:active{transform:scale(.93)}
.check svg{width:13px;height:13px;color:#fff;stroke-width:2.2;stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .16s .04s}
.rem-row.completed .check{background:var(--list-color);border-color:var(--list-color)}
.rem-row.completed .check svg{stroke-dashoffset:0}
.rem-row.completed .rem-title{text-decoration:line-through;color:var(--secondary)}
.rem-row.completed .detail{color:rgba(60,60,67,.38)}
.rem-main{min-width:0;padding-top:1px}
.title-line{display:flex;align-items:baseline;gap:4px;min-height:17px}
.priority{font-weight:800;color:var(--red);letter-spacing:.5px}
.rem-title{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{font-size:11px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.flag{color:var(--orange);display:grid;place-items:center;margin-top:5px;opacity:.95}
.info{
  width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--secondary);margin-top:4px;opacity:0;
  transition:opacity .12s,background .12s,color .12s;
}
.rem-row:hover .info,.info.open{opacity:1}
.info:hover{background:rgba(0,0,0,.06);color:var(--accent)}
.draft-input{
  width:100%;height:24px;border:0;outline:none;background:transparent;padding:0;font-size:13px;color:var(--text);
}
.draft-input::placeholder{color:rgba(60,60,67,.35)}
.popover{
  position:fixed;width:286px;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.25);padding:13px;z-index:20;display:none;
  transform-origin:top right;animation:pop .16s cubic-bezier(.2,.8,.2,1);
}
.popover.show{display:block}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.popover:before{
  content:"";position:absolute;top:-7px;right:20px;width:12px;height:12px;background:#fff;border-left:1px solid rgba(0,0,0,.1);border-top:1px solid rgba(0,0,0,.1);transform:rotate(45deg)
}
.pop-title{font-weight:700;margin-bottom:10px}
.field{margin:9px 0}
.field label{display:block;font-size:11px;color:var(--secondary);margin-bottom:4px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid rgba(0,0,0,.12);background:#fff;border-radius:6px;outline:none;padding:4px 7px;
}
.field input,.field select{height:26px}
.field textarea{height:58px;resize:none}
.field input:focus,.field textarea:focus,.field select:focus{box-shadow:0 0 0 3px rgba(0,122,255,.35)}
.checkline{height:24px;display:flex;align-items:center;gap:7px;color:var(--text)}
.box{
  width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.24);display:grid;place-items:center;transition:background .15s,border-color .15s;
}
.box.on{background:var(--accent);border-color:var(--accent)}
.box svg{width:10px;height:10px;color:#fff;stroke-width:2.2}
.menu-pop{width:190px;padding:6px}
.menu-pop:before{right:15px}
.menu-item{height:28px;border-radius:6px;display:flex;align-items:center;padding:0 9px;width:100%;text-align:left}
.menu-item:hover{background:rgba(0,0,0,.06)}
@media (max-width:760px){
  .toolbar{grid-template-columns:1fr auto}
  .toolbar-left{padding-right:4px}.search{width:min(200px,calc(100vw - 108px))}
  .sidebar{
    position:absolute;z-index:10;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .18s cubic-bezier(.2,.8,.2,1);
    box-shadow:8px 0 24px rgba(0,0,0,.14);
  }
  body.sidebar-open .sidebar{transform:translateX(0)}
  .header{padding-left:24px;padding-right:24px}.list-area{padding-left:20px;padding-right:18px}
  .title,.open-count{font-size:30px}
}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="icon-btn" id="sidebarToggle" aria-label="Show or hide sidebar">
        <svg viewBox="0 0 16 16"><rect x="2.2" y="2.5" width="11.6" height="11" rx="1.7"></rect><path d="M6 2.7v10.6"></path></svg>
      </button>
      <div class="search">
        <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.4"></circle><path d="M10.3 10.3l3.1 3.1"></path></svg>
        <input id="searchInput" type="text" aria-label="Search" placeholder="Search">
      </div>
    </div>
    <div class="toolbar-right">
      <div class="status" id="status">Saved</div>
      <button class="icon-btn" id="newBtn" aria-label="New Reminder">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"></path></svg>
      </button>
      <button class="icon-btn" id="moreBtn" aria-label="More">
        <svg viewBox="0 0 16 16"><circle cx="3.5" cy="8" r=".8" fill="currentColor" stroke="none"></circle><circle cx="8" cy="8" r=".8" fill="currentColor" stroke="none"></circle><circle cx="12.5" cy="8" r=".8" fill="currentColor" stroke="none"></circle></svg>
      </button>
    </div>
  </div>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="smart-grid" id="smartGrid"></div>
      <button class="completed-tile" id="completedTile"></button>
      <div class="section-title">My Lists</div>
      <div class="lists" id="lists"></div>
      <button class="add-list" id="addListBtn">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"></path></svg>
        <span>Add List</span>
      </button>
    </aside>
    <main class="content">
      <div class="header">
        <div class="title" id="mainTitle"></div>
        <button class="header-toggle" id="showToggle"></button>
        <div class="open-count" id="openCount"></div>
      </div>
      <div class="list-area" id="listArea"></div>
    </main>
  </div>
</div>
<div class="popover" id="detailPop"></div>
<div class="popover menu-pop" id="menuPop"></div>
<script>
const AIC=window.aic||{storage:{async get(){return null},async set(){}},async setTitle(){},async notify(){}};
const colors={blue:'#007aff',red:'#ff3b30',grey:'#8e8e93',orange:'#ff9500',green:'#34c759',purple:'#af52de',pink:'#ff2d55'};
let state={
  lists:[
    {id:'reminders',name:'Reminders',color:colors.blue},
    {id:'work',name:'Work',color:colors.purple},
    {id:'personal',name:'Personal',color:colors.green}
  ],
  reminders:[],
  selected:{type:'list',id:'reminders'},
  showCompleted:false,
  nextListColor:0
};
let search='',draft=null,saveTimer=null,detailId=null,dragId=null,addingList=false;
const listArea=document.getElementById('listArea'),smartGrid=document.getElementById('smartGrid'),listsEl=document.getElementById('lists');
const statusEl=document.getElementById('status'),detailPop=document.getElementById('detailPop'),menuPop=document.getElementById('menuPop');
const smartDefs=[
  {id:'today',name:'Today',color:colors.blue,icon:'calendar'},
  {id:'scheduled',name:'Scheduled',color:colors.red,icon:'clock'},
  {id:'all',name:'All',color:colors.grey,icon:'tray'},
  {id:'flagged',name:'Flagged',color:colors.orange,icon:'flag'}
];
function icon(name){
  const p={
    calendar:'<rect x="3" y="3.6" width="10" height="9.7" rx="1.6"></rect><path d="M5.4 2.4v2.3M10.6 2.4v2.3M3.2 6.3h9.6"></path>',
    clock:'<circle cx="8" cy="8" r="5.5"></circle><path d="M8 4.8v3.5l2.4 1.5"></path>',
    tray:'<path d="M3.2 4.2h9.6l1 5.2v2.4a1.5 1.5 0 0 1-1.5 1.5H3.7a1.5 1.5 0 0 1-1.5-1.5V9.4l1-5.2z"></path><path d="M2.4 9.3h3.2c.4 0 .7.2.9.6l.4.8c.2.4.5.6.9.6h.4c.4 0 .7-.2.9-.6l.4-.8c.2-.4.5-.6.9-.6h3.2"></path>',
    flag:'<path d="M4.2 13.2V3.1"></path><path d="M4.2 3.2c2.1-1 3.5.7 5.7-.2.6-.2 1-.4 1.5-.7v5.9c-.5.3-.9.5-1.5.7-2.2.9-3.6-.8-5.7.2"></path>',
    list:'<path d="M5.2 4.2h7.2M5.2 8h7.2M5.2 11.8h7.2"></path><circle cx="3.2" cy="4.2" r=".45" fill="currentColor" stroke="none"></circle><circle cx="3.2" cy="8" r=".45" fill="currentColor" stroke="none"></circle><circle cx="3.2" cy="11.8" r=".45" fill="currentColor" stroke="none"></circle>',
    check:'<path d="M3.3 8.2l2.8 2.8 6-6.4"></path>',
    info:'<circle cx="8" cy="8" r="6"></circle><path d="M8 7.2v4.1M8 4.8h.01"></path>'
  }[name]||'';
  return `<svg viewBox="0 0 16 16">${p}</svg>`;
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function todayISO(offset=0){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+offset);return iso(d)}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseISO(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function formatDate(s,weekday=false){
  const d=parseISO(s);if(!d)return '';
  const mo=d.toLocaleString('en-GB',{month:'short'});
  const w=d.toLocaleString('en-GB',{weekday:'short'});
  return (weekday?w+' ':'')+d.getDate()+' '+mo+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');
}
function formatTime(t){
  if(!t)return '';let [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`;
}
function parseTimeText(str){
  const m=str.match(/\b(?:at\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
  if(!m)return null;let h=+m[1],min=+(m[2]||0),ap=m[3].toLowerCase();
  if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;
  if(h>23||min>59)return null;
  return {time:String(h).padStart(2,'0')+':'+String(min).padStart(2,'0'),text:m[0]};
}
function parseDateText(str){
  const low=str.toLowerCase();
  if(/\btoday\b/.test(low))return {date:todayISO(0),text:str.match(/\btoday\b/i)[0]};
  if(/\btomorrow\b/.test(low))return {date:todayISO(1),text:str.match(/\btomorrow\b/i)[0]};
  const weekdays=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  let wm=low.match(/\bnext\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
  if(wm){
    const now=new Date(),target=weekdays.indexOf(wm[1]);let diff=(target-now.getDay()+7)%7;if(diff===0)diff=7;
    return {date:todayISO(diff),text:str.match(new RegExp('\\bnext\\s+'+wm[1]+'\\b','i'))[0]};
  }
  wm=low.match(/\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
  if(wm){
    const now=new Date(),target=weekdays.indexOf(wm[1]);let diff=(target-now.getDay()+7)%7;
    return {date:todayISO(diff),text:str.match(new RegExp('\\b'+wm[1]+'\\b','i'))[0]};
  }
  const months='jan feb mar apr may jun jul aug sep oct nov dec january february march april june july august september october november december'.split(' ');
  const monMap={jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,september:8,oct:9,october:9,nov:10,november:10,dec:11,december:11};
  let re=new RegExp('\\b(\\d{1,2})\\s+('+months.join('|')+')(?:\\s+(\\d{4}))?\\b','i'),m=str.match(re);
  if(!m){re=new RegExp('\\b('+months.join('|')+')\\s+(\\d{1,2})(?:\\s+(\\d{4}))?\\b','i');m=str.match(re);if(m)m=[m[0],m[2],m[1],m[3]]}
  if(m){
    const now=new Date();let y=m[3]?+m[3]:now.getFullYear(),d=+m[1],mo=monMap[m[2].toLowerCase()];
    let dt=new Date(y,mo,d);if(!m[3]&&dt<new Date(now.getFullYear(),now.getMonth(),now.getDate()))dt.setFullYear(y+1);
    return {date:iso(dt),text:m[0]};
  }
  return null;
}
function parseNatural(title){
  let clean=title,dueDate=null,dueTime=null;
  const tm=parseTimeText(clean);if(tm){dueTime=tm.time;clean=clean.replace(tm.text,' ')}
  const dm=parseDateText(clean);if(dm){dueDate=dm.date;clean=clean.replace(dm.text,' ')}
  clean=clean.replace(/\b(at|on)\s*$/i,'').replace(/\s+\b(at|on)\b\s+/ig,' ').replace(/\s{2,}/g,' ').trim();
  return {title:clean||title.trim(),dueDate,dueTime};
}
function detailText(r){
  const parts=[]; if(r.dueDate)parts.push((r.dueDate===todayISO()? 'Today':formatDate(r.dueDate,true))+(r.dueTime?' '+formatTime(r.dueTime):''));
  if(r.notes)parts.push(r.notes); return parts.join(' — ');
}
function listById(id){return state.lists.find(l=>l.id===id)||state.lists[0]}
function listColor(id){return listById(id)?.color||colors.blue}
function smartCount(id){
  return filteredBase(id).filter(r=>!r.completed).length;
}
function completedCount(){return state.reminders.filter(r=>r.completed).length}
function filteredBase(id){
  const t=todayISO();
  if(id==='today')return state.reminders.filter(r=>r.dueDate===t);
  if(id==='scheduled')return state.reminders.filter(r=>r.dueDate);
  if(id==='all')return state.reminders.slice();
  if(id==='flagged')return state.reminders.filter(r=>r.flagged);
  if(id==='completed')return state.reminders.filter(r=>r.completed);
  return state.reminders.filter(r=>r.listId===id);
}
function currentItems(){
  let arr= state.selected.type==='smart'?filteredBase(state.selected.id):filteredBase(state.selected.id);
  if(state.selected.id!=='completed'&&!state.showCompleted)arr=arr.filter(r=>!r.completed);
  if(search.trim()){
    const q=search.trim().toLowerCase();
    arr=arr.filter(r=>(r.title+' '+(r.notes||'')).toLowerCase().includes(q));
  }
  return arr.sort((a,b)=>(a.order||0)-(b.order||0)||(a.created||'').localeCompare(b.created||''));
}
function currentTitle(){
  if(state.selected.type==='smart'){
    const d={today:'Today',scheduled:'Scheduled',all:'All',flagged:'Flagged',completed:'Completed'};return d[state.selected.id];
  }
  return listById(state.selected.id).name;
}
function currentColor(){
  if(state.selected.type==='smart'){
    return {today:colors.blue,scheduled:colors.red,all:colors.grey,flagged:colors.orange,completed:colors.grey}[state.selected.id];
  }
  return listColor(state.selected.id);
}
function currentOpenCount(){
  const id=state.selected.id;
  if(id==='completed')return completedCount();
  return filteredBase(id).filter(r=>!r.completed).length;
}
function defaultForSelection(){
  let o={listId:state.selected.type==='list'?state.selected.id:'reminders',dueDate:null,dueTime:null,flagged:false,completed:false};
  if(state.selected.id==='today'||state.selected.id==='scheduled')o.dueDate=todayISO();
  if(state.selected.id==='flagged')o.flagged=true;
  return o;
}
function render(){
  renderSidebar();renderMain();
}
function renderSidebar(){
  smartGrid.innerHTML=smartDefs.map(s=>`
    <button class="tile ${state.selected.type==='smart'&&state.selected.id===s.id?'selected':''}" data-smart="${s.id}">
      <span class="circle" style="background:${s.color}">${icon(s.icon)}</span>
      <span class="count">${smartCount(s.id)}</span><span class="label">${s.name}</span>
    </button>`).join('');
  document.getElementById('completedTile').className='completed-tile '+(state.selected.type==='smart'&&state.selected.id==='completed'?'selected':'');
  document.getElementById('completedTile').innerHTML=`
    <span class="circle">${icon('check')}</span><span class="label">Completed</span><span class="count">${completedCount()}</span>
    <button class="toggle-mini" id="completedToggle">${state.showCompleted?'Hide':'Show'}</button>`;
  listsEl.innerHTML=state.lists.map(l=>`
    <button class="side-row ${state.selected.type==='list'&&state.selected.id===l.id?'selected':''}" data-list="${l.id}">
      <span class="list-dot" style="background:${l.color}">${icon('list')}</span>
      <span class="side-name">${escapeHTML(l.name)}</span>
      <span class="side-count">${filteredBase(l.id).filter(r=>!r.completed).length}</span>
    </button>`).join('');
  if(addingList){
    document.getElementById('addListBtn').innerHTML=`<svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"></path></svg><input id="newListName" placeholder="List Name">`;
    setTimeout(()=>document.getElementById('newListName')?.focus(),0);
  }else{
    document.getElementById('addListBtn').innerHTML=`<svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"></path></svg><span>Add List</span>`;
  }
}
function renderMain(){
  const color=currentColor();
  document.getElementById('mainTitle').textContent=currentTitle();
  document.getElementById('mainTitle').style.color=color;
  document.getElementById('openCount').textContent=currentOpenCount();
  const tog=document.getElementById('showToggle');
  tog.textContent=state.showCompleted?'Hide Completed':'Show Completed';
  tog.style.display=completedCount()&&state.selected.id!=='completed'?'block':'none';
  const items=currentItems();
  let rows=items.map(r=>rowHTML(r,color)).join('');
  if(draft)rows+=draftHTML(color);
  listArea.innerHTML=rows+(items.length===0&&!draft?'<div class="empty-state">No Reminders</div>':'');
  if(draft)setTimeout(()=>{const i=document.getElementById('draftInput');if(i){i.focus();i.value=draft.title||''}},0);
}
function rowHTML(r,color){
  const lc=listColor(r.listId),det=detailText(r);
  return `<div class="rem-row ${r.completed?'completed':''}" draggable="${state.selected.type==='list'&&!search}" data-id="${r.id}" style="--list-color:${lc}">
    <button class="check" data-act="complete" aria-label="Complete reminder">${icon('check')}</button>
    <div class="rem-main">
      <div class="title-line">${r.priority?`<span class="priority">${'!'.repeat(r.priority)}</span>`:''}<span class="rem-title">${escapeHTML(r.title)}</span></div>
      ${det?`<div class="detail">${escapeHTML(det)}</div>`:''}
    </div>
    <button class="info ${detailId===r.id?'open':''}" data-act="info" aria-label="Details">${icon('info')}</button>
    <div class="flag">${r.flagged?icon('flag'):''}</div>
  </div>`;
}
function draftHTML(color){
  return `<div class="rem-row draft" style="--list-color:${color}">
    <button class="check" tabindex="-1">${icon('check')}</button>
    <div class="rem-main"><input class="draft-input" id="draftInput" placeholder="New Reminder" value="${escapeAttr(draft.title||'')}"></div>
    <span></span><span></span>
  </div>`;
}
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return escapeHTML(s).replace(/"/g,'&quot;')}
function selectSmart(id){state.selected={type:'smart',id};draft=null;hidePops();render();if(innerWidth<=760)document.body.classList.remove('sidebar-open')}
function selectList(id){state.selected={type:'list',id};draft=null;hidePops();render();if(innerWidth<=760)document.body.classList.remove('sidebar-open')}
function startDraft(){
  if(draft)return;
  draft={title:'',committed:false};
  hidePops();render();
}
function commitDraft(openNext){
  if(!draft||draft.committed)return;
  const raw=(document.getElementById('draftInput')?.value||draft.title||'').trim();
  draft.committed=true;
  if(!raw){draft=null;render();return}
  const nat=parseNatural(raw),def=defaultForSelection();
  const r={id:uid(),listId:def.listId,title:nat.title,notes:'',dueDate:nat.dueDate||def.dueDate,dueTime:nat.dueTime||def.dueTime,flagged:def.flagged,priority:0,completed:false,created:new Date().toISOString(),order:Date.now()};
  state.reminders.push(r);save();
  draft=openNext?{title:'',committed:false}:null;
  render();
}
function abandonDraft(){
  if(!draft)return;
  const val=(document.getElementById('draftInput')?.value||'').trim();
  if(val&&!draft.committed)commitDraft(false);else{draft=null;render()}
}
function save(){
  showStatus('Saving…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await AIC.storage.set('reminders.state',state);showStatus('Saved');}
    catch(e){showStatus('Save failed',true)}
  },220);
}
function showStatus(t,err=false){
  statusEl.textContent=t;statusEl.style.color=err?'#ff3b30':'rgba(60,60,67,.6)';statusEl.classList.add('show');
  clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>statusEl.classList.remove('show'),err?3500:1400);
}
function hidePops(){detailPop.classList.remove('show');menuPop.classList.remove('show');detailId=null}
function openDetails(id,btn){
  detailId=id;const r=state.reminders.find(x=>x.id===id);if(!r)return;
  detailPop.innerHTML=`
    <div class="pop-title">Details</div>
    <div class="field"><label>Notes</label><textarea id="popNotes">${escapeHTML(r.notes||'')}</textarea></div>
    <div class="field"><label>Date</label><input id="popDate" placeholder="1 Nov 2026" value="${r.dueDate?formatDate(r.dueDate):''}"></div>
    <div class="field"><label>Time</label><input id="popTime" placeholder="9:30 AM" value="${r.dueTime?formatTime(r.dueTime):''}"></div>
    <button class="checkline" id="popFlag"><span class="box ${r.flagged?'on':''}">${r.flagged?icon('check'):''}</span><span>Flag</span></button>
    <div class="field"><label>Priority</label><select id="popPriority">
      <option value="0">None</option><option value="1">Low</option><option value="2">Medium</option><option value="3">High</option>
    </select></div>`;
  document.body.appendChild(detailPop);
  const rect=btn.getBoundingClientRect();
  detailPop.style.left=Math.max(8,Math.min(innerWidth-300,rect.right-286))+'px';
  detailPop.style.top=Math.min(innerHeight-330,rect.bottom+8)+'px';
  detailPop.classList.add('show');document.getElementById('popPriority').value=r.priority||0;
  const update=()=>{r.notes=document.getElementById('popNotes').value;r.priority=+document.getElementById('popPriority').value;save();renderMain()};
  document.getElementById('popNotes').addEventListener('input',update);
  document.getElementById('popPriority').addEventListener('change',update);
  document.getElementById('popFlag').addEventListener('click',()=>{r.flagged=!r.flagged;save();openDetails(id,btn);render()});
  document.getElementById('popDate').addEventListener('blur',e=>{const v=e.target.value.trim();r.dueDate=v?(parseDateText(v)?.date||r.dueDate):null;save();render();});
  document.getElementById('popTime').addEventListener('blur',e=>{const v=e.target.value.trim();r.dueTime=v?(parseTimeText(v)?.time||r.dueTime):null;save();render();});
}
function openMenu(btn){
  menuPop.innerHTML=`
    <button class="menu-item" id="mToggle">${state.showCompleted?'Hide Completed':'Show Completed'}</button>
    <button class="menu-item" id="mToday">New Reminder for Today</button>
    <button class="menu-item" id="mFlag">New Flagged Reminder</button>`;
  const rect=btn.getBoundingClientRect();
  menuPop.style.left=Math.max(8,Math.min(innerWidth-200,rect.right-190))+'px';
  menuPop.style.top=(rect.bottom+8)+'px';menuPop.classList.add('show');
  document.getElementById('mToggle').onclick=()=>{state.showCompleted=!state.showCompleted;save();hidePops();render()};
  document.getElementById('mToday').onclick=()=>{state.selected={type:'smart',id:'today'};hidePops();startDraft()};
  document.getElementById('mFlag').onclick=()=>{state.selected={type:'smart',id:'flagged'};hidePops();startDraft()};
}
smartGrid.addEventListener('click',e=>{const b=e.target.closest('[data-smart]');if(b)selectSmart(b.dataset.smart)});
document.getElementById('completedTile').addEventListener('click',e=>{
  if(e.target.closest('#completedToggle')){state.showCompleted=!state.showCompleted;save();render();return}
  selectSmart('completed');
});
listsEl.addEventListener('click',e=>{const b=e.target.closest('[data-list]');if(b)selectList(b.dataset.list)});
document.getElementById('showToggle').onclick=()=>{state.showCompleted=!state.showCompleted;save();render()};
document.getElementById('sidebarToggle').onclick=()=>document.body.classList.toggle('sidebar-open');
document.getElementById('newBtn').onclick=startDraft;
document.getElementById('moreBtn').onclick=e=>openMenu(e.currentTarget);
document.getElementById('searchInput').addEventListener('input',e=>{search=e.target.value;renderMain()});
document.getElementById('addListBtn').addEventListener('click',e=>{
  if(addingList)return;addingList=true;renderSidebar();
});
document.getElementById('addListBtn').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='newListName'){e.preventDefault();finishAddList(e.target.value)}
  if(e.key==='Escape'){addingList=false;renderSidebar()}
});
document.getElementById('addListBtn').addEventListener('focusout',e=>{
  if(e.target.id==='newListName')setTimeout(()=>finishAddList(e.target.value),0);
});
function finishAddList(name){
  if(!addingList)return;addingList=false;name=(name||'').trim();
  if(name){
    const palette=[colors.pink,colors.orange,colors.green,colors.purple,colors.blue,colors.red];
    const l={id:uid(),name,color:palette[state.nextListColor++%palette.length]};
    state.lists.push(l);state.selected={type:'list',id:l.id};save();
  }
  render();
}
listArea.addEventListener('click',e=>{
  const row=e.target.closest('.rem-row');
  if(e.target.closest('[data-act="complete"]')){const r=state.reminders.find(x=>x.id===row.dataset.id);if(r){r.completed=!r.completed;save();render()}return}
  if(e.target.closest('[data-act="info"]')){openDetails(row.dataset.id,e.target.closest('[data-act="info"]'));renderMain();return}
  if(e.target===listArea||e.target.classList.contains('empty-state'))startDraft();
});
listArea.addEventListener('input',e=>{if(e.target.id==='draftInput'&&draft)draft.title=e.target.value});
listArea.addEventListener('keydown',e=>{
  if(e.target.id==='draftInput'){
    if(e.key==='Enter'){e.preventDefault();commitDraft(true)}
    if(e.key==='Escape'){draft=null;render()}
  }
});
listArea.addEventListener('focusout',e=>{if(e.target.id==='draftInput')setTimeout(()=>{if(document.activeElement?.id!=='draftInput')abandonDraft()},0)});
listArea.addEventListener('dragstart',e=>{
  const row=e.target.closest('.rem-row[data-id]');if(!row)return;dragId=row.dataset.id;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';
});
listArea.addEventListener('dragend',e=>{dragId=null;document.querySelectorAll('.drop-before,.dragging').forEach(x=>x.classList.remove('drop-before','dragging'))});
listArea.addEventListener('dragover',e=>{
  if(!dragId||state.selected.type!=='list')return;e.preventDefault();
  document.querySelectorAll('.drop-before').forEach(x=>x.classList.remove('drop-before'));
  const row=e.target.closest('.rem-row[data-id]');if(row&&row.dataset.id!==dragId)row.classList.add('drop-before');
});
listArea.addEventListener('drop',e=>{
  const row=e.target.closest('.rem-row[data-id]');if(!dragId||!row||state.selected.type!=='list')return;e.preventDefault();
  const arr=currentItems().filter(r=>r.listId===state.selected.id),from=arr.findIndex(r=>r.id===dragId),to=arr.findIndex(r=>r.id===row.dataset.id);
  if(from<0||to<0)return;const [m]=arr.splice(from,1);arr.splice(to,0,m);arr.forEach((r,i)=>r.order=Date.now()+i);save();render();
});
document.addEventListener('mousedown',e=>{if(!detailPop.contains(e.target)&&!menuPop.contains(e.target)&&!e.target.closest('[data-act="info"]')&&!e.target.closest('#moreBtn'))hidePops()});
window.addEventListener('resize',()=>hidePops());
async function init(){
  try{await AIC.setTitle?.('Reminders')}catch(e){}
  try{
    const saved=await AIC.storage.get('reminders.state');
    if(saved&&saved.lists&&saved.reminders){state={...state,...saved}}
  }catch(e){showStatus('Load failed',true)}
  render();
}
init();
</script>
</body>
</html>
