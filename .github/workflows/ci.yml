name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # The build needs no secrets; these only let route modules load.
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          SESSION_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
