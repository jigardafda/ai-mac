name: Bug report
description: Something is broken or behaves wrongly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **For security problems, do not use this form.** Report them privately: see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Sign in\n2. Open Bomberman\n3. ..."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where did it happen?
      description: The live site, or your own instance (and the commit)?
      placeholder: "https://ai-mac.jigardafda.com, or commit abc1234 locally"
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: "Chrome 130 on macOS 15"
  - type: textarea
    id: logs
    attributes:
      label: Console or server output
      description: Remove anything private first. Never paste keys, cookies or sign-in codes.
      render: shell
